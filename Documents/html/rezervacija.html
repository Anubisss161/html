<body><header>

  <h1>Rezervacija mize</h1>

  <form action="rezervacija.html" method="get">
    <fieldset>
      <legend>Kontaktni podatki</legend>

      <p>
        <label for="ime">Ime in priimek:</label>
        <input type="text" id="ime" name="ime" required>
      </p>

      <p>
        <label for="eposta">Elektronska pošta:</label>
        <input type="email" id="eposta" name="eposta" required>
      </p>

      <p>
        <label for="telefon">Telefon:</label>
        <input type="tel" id="telefon" name="telefon">
      </p>
    </fieldset>

    <fieldset>
      <legend>Podrobnosti rezervacije</legend>

      <p>
        <label for="datum">Datum:</label>
        <input type="date" id="datum" name="datum" required>
      </p>

      <p>
        <label for="ura">Ura:</label>
        <input type="time" id="ura" name="ura" min="10:00" max="22:00" required>
      </p>

      <p>
        <label for="osebe">Število oseb:</label>
        <input type="number" id="osebe" name="osebe" min="1" max="12" required>
      </p>

      <p>
        <label for="prostor">Prostor:</label>
        <select id="prostor" name="prostor">
          <option value="notranjost">Notranjost</option>
          <option value="terasa">Terasa</option>
          <option value="zasebna">Zasebna soba</option>
        </select>
      </p>

      <p>Priložnost:</p>
      <label>
        <input type="radio" name="brez" value="brez">
        Brez
      </label>
      <label>
        <input type="radio" name="priloznost" value="rojstni-dan">
        Rojstni dan
      </label>
      <label>
        <input type="radio" name="priloznost" value="obletnica">
        Obletnica
      </label>
      <label>
        <input type="radio" name="priloznost" value="poslovno-srecanje">
        Poslovno srečanje
      </label>
    </fieldset>

    <fieldset>
      <legend>Dodatne želje</legend>

      <p>Prehranske omejitve:</p>
      <label>
        <input type="checkbox" name="prehrana" value="vegetarijansko">
        Vegetarijansko
      </label>
      <label>
        <input type="checkbox" name="prehrana" value="vegansko">
        Vegansko
      </label>
      <label>
        <input type="checkbox" name="prehrana" value="gluten">
        Brez glutena
      </label>
      <label>
        <input type="checkbox" name="prehrana" value="laktoza">
        Brez laktoze
      </label>

      <p>
        <label for="opombe">Opombe:</label><br>
        <textarea id="opombe" name="opombe" cols="50" rows="5"></textarea>
      </p>

      <p>
        <label>
          <input type="checkbox" name="podatki" value="podatki" required>
          Strinjam se z obdelavo osebnih podatkov
        </label>
      </p>
    </fieldset>

    <button type="submit">Pošlji rezervacijo</button>
    <button type="reset">Ponastavi</button>
  </form>
</body>
</html>
